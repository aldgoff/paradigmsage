<nav>
  {{ $current := .RelPermalink }}

  {{ range .CurrentSection.Pages.ByParam "order" }}
    {{ $active := eq .RelPermalink $current }}

    <div style="margin-bottom:0.4rem;">
      <a href="{{ .RelPermalink }}"
        title="{{ .Title }}"
        style="
          text-decoration:none;
          color:inherit;
          {{ if $active }}font-weight:600;{{ else }}opacity:0.8;{{ end }}
        ">
        <span>{{ .Date.Format "2006/01/02" }} – {{ .Params.nickname }}</span>
      </a>
    </div>
    
  {{ end }}

</nav>
