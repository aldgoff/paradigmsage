{{ define "main" }}

  <div style="display:flex; gap:2rem;">

    <aside style="width:18rem; flex-shrink:0; font-size:0.9rem;">
      {{ partial "qt3/nav.html" . }}
    </aside>

    <section style="flex:1; min-width:0; max-width:86ch;">
      {{ .Content }}

      {{/* Avoid cache churn. */}}
      {{ $js := resources.Get "qt3/js/main.js" | js.Build | fingerprint }}
      <script type="module" src="{{ $js.RelPermalink }}"></script>
    </section>

  </div>

{{ end }}
